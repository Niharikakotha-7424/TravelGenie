{% extends "base.html" %}

{% block title %}
Create Account
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card wide">

        <div class="auth-logo">
            ✈️
        </div>

        <h1>
            Create Your Account
        </h1>

        <p>
            Start planning smarter journeys.
        </p>


        <form method="POST">

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Full Name *
                    </label>

                    <input
                        type="text"
                        name="full_name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Username *
                    </label>

                    <input
                        type="text"
                        name="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Email *
                    </label>

                    <input
                        type="email"
                        name="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        name="mobile"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password *
                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Confirm Password *
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="generate-btn"
            >
                Create Account
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</section>

{% endblock %}
